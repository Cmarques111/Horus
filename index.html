<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080B">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>HORUS · Consultoria Financeira</title>
<style>[hidden]{display:none!important}html,body{margin:0}img{max-width:100%}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
</head>
<body>

<div id="login" class="login">
  <div class="login-card">
    <div class="login-brand" id="loginBrand"></div>
    <form class="login-form" id="loginForm" novalidate>
      <h1 id="lgTitle">Acesso interno</h1>
      <p class="muted" id="lgSub">Entre com seu e-mail e senha de assessor.</p>
      <label class="fld" id="lgNameF" hidden><span>Seu nome</span><input id="lgName" name="name" type="text" autocomplete="name"></label>
      <label class="fld"><span>E-mail</span><input id="lgUser" name="email" type="email" autocomplete="username" inputmode="email"></label>
      <label class="fld" id="lgPassF"><span>Senha</span><input id="lgPass" name="pass" type="password" autocomplete="current-password"></label>
      <button class="btn btn-primary btn-lg" type="submit" id="lgGo">Entrar</button>
      <p class="lg-msg" id="lgMsg" role="status" aria-live="polite"></p>
      <div class="lg-links" id="lgLinks"></div>
      <p class="hint" id="lgHint"></p>
    </form>
  </div>
</div>

<div id="app" class="app" hidden>
  <header class="topbar">
    <div class="tb-in">
      <a class="brand" href="#inicio" id="brand" aria-label="HORUS, início"></a>
      <div class="search">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="gsearch" type="search" placeholder="Pesquisar clientes e produtos…" autocomplete="off" aria-label="Pesquisar">
        <div id="gresults" class="gresults" hidden></div>
      </div>
      <div class="tb-actions">
        <div id="asSel"></div>
        <button class="ibtn" data-act="newLanc" aria-label="Novo lançamento"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="avatar-btn" data-act="userMenu" aria-label="Menu do usuário"><span class="av av-lg" id="meAv">CM</span></button>
      </div>
    </div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Módulos"></nav>
  <main id="main" class="main" tabindex="-1"></main>
  <footer class="util">
    <div class="util-in">
      <button class="ubtn" data-act="openNotes"><svg class="ic" viewBox="0 0 24 24"><path d="M5 4h10l4 4v12H5z"/><path d="M9 12h6M9 16h4"/></svg><span>Notas</span></button>
      <button class="ubtn" data-act="toggleHP"><svg class="ic" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h2M12 11h2M8 15h2M12 15h2M16 15v3"/></svg><span>Calculadora HP12C</span></button>
      <button class="ubtn" data-act="simular"><svg class="ic" viewBox="0 0 24 24"><path d="M4 19h16M7 15l3-4 3 2 4-6"/></svg><span>Simular comissão</span></button>
      <span class="util-sp"></span>
      <span class="util-sync" id="syncInfo"><span class="live-dot"></span>Salvo neste navegador</span>
    </div>
  </footer>
</div>

<div id="scrim" class="scrim" hidden></div>
<aside id="drawer" class="drawer" hidden aria-label="Detalhes"></aside>
<div id="pop" class="pop" hidden></div>
<div id="modal" class="modal-wrap" hidden></div>
<section id="hp" class="hp" hidden aria-label="Calculadora financeira HP12C"></section>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
